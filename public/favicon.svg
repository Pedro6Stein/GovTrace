<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo arredondado vermelho institucional -->
  <rect width="32" height="32" rx="8" fill="#a20000"/>
  <!-- Ícone: prédio público (AccountBalance) simplificado em branco -->
  <!-- Coluna central (frontão triangular) -->
  <polygon points="16,5 28,11 4,11" fill="white" opacity="0.95"/>
  <!-- Colunas -->
  <rect x="6"  y="12" width="3" height="10" rx="1" fill="white" opacity="0.9"/>
  <rect x="11" y="12" width="3" height="10" rx="1" fill="white" opacity="0.9"/>
  <rect x="16" y="12" width="3" height="10" rx="1" fill="white" opacity="0.9"/>
  <rect x="21" y="12" width="3" height="10" rx="1" fill="white" opacity="0.9"/>
  <!-- Base -->
  <rect x="4" y="23" width="24" height="3" rx="1.5" fill="white" opacity="0.95"/>
  <!-- Degrau -->
  <rect x="3" y="26.5" width="26" height="2" rx="1" fill="white" opacity="0.7"/>
</svg>
